[workspace]
members = [
    "crate_macro",
    "course-signin",
    "course-signin-cli",
    "course-signin-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crate-macro = { path = "crate_macro" }
course-signin = { path = "course-signin" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tabled = { version = "0.22", features = ["derive"] }
rand = "0.8"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"